<script>
  let skqExt = new URLSearchParams(location.search).get('ext');
  // фреймы формы загрузки открываются без параметров — режим помним на вкладке
  try {
    if (skqExt) sessionStorage.setItem('skqExt', skqExt);
    else skqExt = sessionStorage.getItem('skqExt');
  } catch (e) { /* ignore */ }
  if (!skqExt) {
    // обычный режим: песочница Tampermonkey
    const store = JSON.parse(localStorage.getItem('gm') || '{}');
    window.GM_getValue = (k, d) => (k in store ? store[k] : d);
    window.GM_setValue = (k, v) => { store[k] = v; localStorage.setItem('gm', JSON.stringify(store)); };
    window.GM_registerMenuCommand = (n, fn) => { window.__openMenu = fn; };
    window.GM_addElement = (tag, attrs) => { const s = document.createElement(tag); Object.assign(s, attrs); document.documentElement.appendChild(s); return s; };
    document.write('<script src="/us.js"><\/script>');
  } else {
    // режим расширения: асинхронное хранилище и кнопка на панели
    const box = JSON.parse(localStorage.getItem('extstore') || '{}');
    window.__extInjected = [];
    window.chrome = {
      storage: { local: {
        get(key, cb) { setTimeout(() => cb(key in box ? { [key]: box[key] } : {}), 50); },
        set(obj) { Object.assign(box, obj); localStorage.setItem('extstore', JSON.stringify(box)); },
      } },
      runtime: {
        getURL: (p) => '/' + p,
        onMessage: { addListener(fn) { window.__extMessage = fn; } },
      },
    };
    const orig = document.createElement.bind(document);
    if (skqExt === 'main') document.write('<script src="/core-main.js"><\/script>');
    document.write('<script src="' + (skqExt === 'mv2' ? '/bridge-mv2.js' : '/bridge.js') + '"><\/script>');
  }
</script>

      text.className = 'MuiListItemText-primary';
      text.textContent = word(wordKey);
      li.appendChild(text);
      if (href) li.addEventListener('click', () => {
        history.pushState({}, '', '/' + lang + href);
        window.dispatchEvent(new PopStateEvent('popstate'));
        document.getElementById('drawer').classList.remove('open');
      });
      list.appendChild(li);
    };
    for (const [key, wordKey, href, children] of MENU_TREE) {
