name: release

# Тег vX.Y.Z собирает все цели и выкладывает их в Releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Сборка
        run: python build.py --zip

      - name: Собранный юзерскрипт совпадает с исходниками
        run: git diff --exit-code -- sankaku-quick-actions.user.js

      - name: Версия совпадает с тегом
        if: startsWith(github.ref, 'refs/tags/')
        run: python .github/workflows/check_version.py "${GITHUB_REF_NAME}"

      - name: Описание релиза
        if: startsWith(github.ref, 'refs/tags/')
        run: python .github/workflows/release_notes.py "${GITHUB_REF_NAME}" notes.md

      - name: Публикация
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            sankaku-quick-actions.user.js \
            dist/sankaku-chrome-*.zip \
            dist/sankaku-firefox-mv3-*.zip \
            dist/sankaku-firefox-mv2-*.zip \
            dist/sankaku-source-*.zip \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md
